{% extends "base.html" %}
{% block title %}{{ 'Edit Student' if student else 'Add Student' }}{% endblock %}
{% block content %}
<div class="page-header">
    <div><h1>{{ 'Edit Student' if student else 'Add Student' }}</h1><p>Store student details for issue and return tracking.</p></div>
</div>
<section class="panel form-panel">
    <form method="post" class="row g-3 needs-validation" novalidate>
        <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ student.name if student else '' }}" required></div>
        <div class="col-md-6"><label class="form-label">Roll Number</label><input class="form-control" name="roll_number" value="{{ student.roll_number if student else '' }}" required></div>
        <div class="col-md-6"><label class="form-label">Course</label><input class="form-control" name="course" value="{{ student.course if student else 'BCA' }}" required></div>
        <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" value="{{ student.email if student else '' }}" required></div>
        <div class="col-md-6"><label class="form-label">Phone Number</label><input class="form-control" name="phone" value="{{ student.phone if student else '' }}" required></div>
        <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
            <a class="btn btn-light" href="{{ url_for('students.index') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
