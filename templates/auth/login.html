{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="login-card">
    <div class="login-mark"><i class="bi bi-book-half"></i></div>
    <h1>Library Management System</h1>
    <p>Admin access panel</p>
    <form method="post" class="needs-validation" novalidate>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
            <div class="invalid-feedback">Username is required.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
            <div class="invalid-feedback">Password is required.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Login</button>
    </form>
    <div class="demo-note">Default login: <strong>admin</strong> / <strong>admin123</strong></div>
</div>
{% endblock %}
